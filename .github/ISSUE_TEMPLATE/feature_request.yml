name: 功能建议
description: 提议新功能或改进现有行为
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前调试流程里缺了哪一步。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 希望界面或协议层如何变化。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 其它考虑过的做法
