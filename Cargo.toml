[package]
name = "mqttc"
version = "0.1.1"
edition = "2021"
description = "A desktop MQTT debug client"
license = "MIT"
readme = "README.md"
authors = ["Gordon Wen <godwen@qq.com>"]
repository = "https://github.com/gordonwen/mqttc"
homepage = "https://github.com/gordonwen/mqttc"
keywords = ["mqtt", "iot", "debug", "client", "gui"]
categories = ["network-programming", "gui"]
exclude = ["dist/*", ".monkeycode/*"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }
rustls = "0.22"
rustls-native-certs = "0.7"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-software",
    "compat-1-2",
    "raw-window-handle-06",
] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
