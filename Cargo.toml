[package]
name = "mqttc"
version = "0.1.0"
edition = "2021"
description = "A desktop MQTT debug client"
license = "MIT"

[dependencies]
base64 = "0.22"
chrono = "0.4"
rumqttc = { version = "0.24", features = ["use-rustls"] }
rustls = "0.22"
rustls-native-certs = "0.7"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.11", features = ["raw-window-handle-06"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.11"
