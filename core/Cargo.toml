[package]
name = "mqttc-core"
description = "UI-agnostic MQTT debug client core: config, payload codecs, MQTT worker, runtime state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
bytes = "1"
chrono = { workspace = true }
rumqttc = { workspace = true }
rustls = { workspace = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }

[dev-dependencies]
# Embedded rumqttd broker for the end-to-end round-trip tests.
mqttc-test-broker = { path = "../tools/test-broker" }
